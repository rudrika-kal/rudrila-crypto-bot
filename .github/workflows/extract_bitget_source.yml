name: Extract Bitget bot source for repair
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current bot source
        run: |
          rm -rf extracted_bot
          mkdir extracted_bot
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("RUDRILA_Bitget_AI_v1_1_DEMO_READY.zip") as z:
              z.extractall("extracted_bot")
          PY
      - name: Commit extracted source
        run: |
          git config user.name "rudrila-repair-bot"
          git config user.email "rudrila-repair-bot@users.noreply.github.com"
          git add extracted_bot
          git diff --cached --quiet && exit 0
          git commit -m "Expose Bitget bot source for HTTP 400 repair"
          git push
