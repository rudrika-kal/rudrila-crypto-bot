name: RUDRILA Crypto Paper Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: rudrila-paper-bot
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python RUDRILA_Crypto_AI_v0_5_GITHUB.py --cycles 10

      - name: Save paper state
        if: always()
        run: |
          git config user.name "rudrila-bot"
          git config user.email "rudrila-bot@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "Update RUDRILA paper state"
            git push
          else
            echo "No state changes to save."
          fi
