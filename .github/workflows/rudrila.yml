

name: RUDRILA Crypto Paper Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: rudrila-paper-bot
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate code
        run: |
          python -m py_compile RUDRILA_Crypto_AI_v0_5_2_SAFE.py
          python RUDRILA_Crypto_AI_v0_5_2_SAFE.py --test

      - name: Run paper-only monitor
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u RUDRILA_Crypto_AI_v0_5_2_SAFE.py --cycles 8

      - name: Upload recovery backup (even if push fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rudrila-paper-state-${{ github.run_id }}
          path: state/
          if-no-files-found: warn
          retention-days: 7

      - name: Save paper state (conflict-safe)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rudrila-bot"
          git config user.email "rudrila-bot@users.noreply.github.com"
          git add -A state/
          if git diff --cached --quiet; then
            echo "No state changes to save."
            exit 0
          fi
          git commit -m "Update RUDRILA paper state"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::State conflict; download recovery artifact."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Paper state committed."
              exit 0
            fi
            sleep $(( attempt * 2 ))
          done
          echo "::error::State push failed; download recovery artifact."
          exit 1
